<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stripboard Studio">
  <title>Stripboard Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/document-editor.css">
  <link rel="stylesheet" href="assets/workspace-ui.css">
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="topbar">
        <div class="brand" aria-label="Stripboard Studio"><span class="brand-mark" aria-hidden="true">▥</span><span><strong>STRIPBOARD</strong><small>STUDIO</small></span></div>
        <details class="project-heading"><summary><div><h1 id="projectTitle">Stripboard Studio</h1><p id="projectSubtitle">Caricamento del progetto…</p></div><span aria-hidden="true">⌄</span></summary><div class="project-menu"><div class="control" id="projectControl"><label for="projectSelect">PROGETTO</label><select id="projectSelect"><option value="wonderful">Wonderful Life</option></select></div><button id="newDocumentButton" type="button">＋ Nuovo progetto</button></div></details>
        <div class="top-actions"><button id="undoMoveButton" class="subtle-button" type="button" disabled aria-label="Annulla" title="Annulla l’ultima modifica">↶ Annulla</button><button id="redoMoveButton" class="subtle-button" type="button" disabled aria-label="Ripeti" title="Ripristina l’ultima modifica annullata">↷ Ripeti</button><span class="local-badge" title="File elaborati in locale">● Locale</span><span id="dirtyIndicator" role="status">Salvato</span><label class="upload" tabindex="0" role="button" aria-label="Importa un progetto .msd, .mmsx o .studio.json"><input id="fileInput" type="file" accept=".msd,.mmsx,.studio.json">＋ <span>Importa</span></label><button id="saveButton" type="button">↓ Salva .msd</button><button id="printButton" class="print-button" aria-label="Stampa vista" title="Stampa vista" type="button">↗ <span>Stampa vista</span></button></div>
      </div>
      <nav class="primary-nav" aria-label="Navigazione principale">
        <button class="nav active" id="boardNav" title="Durante un drag, tieni la strip qui per aprire la Stripboard" type="button" aria-current="page"><span aria-hidden="true">▤</span> Stripboard <em id="boardCount">—</em></button>
        <button class="nav" id="breakdownNav" type="button"><span aria-hidden="true">▧</span> Breakdown</button>
        <button class="nav" id="calendarNav" title="Durante un drag, tieni la strip qui per aprire Calendar" type="button"><span aria-hidden="true">▦</span> Calendar <em id="calendarCount">—</em></button>
        <button class="nav" id="doodNav" type="button"><span aria-hidden="true">▦</span> DooD</button>
        <button class="nav" id="redFlagNav" type="button" title="Red Flag Entry"><span aria-hidden="true">⚑</span> Red Flags <em id="redFlagCount">—</em></button>
        <button class="nav" id="dataNav" type="button" title="Elementi e categorie"><span aria-hidden="true">≡</span> Elementi</button>
        <button class="nav" id="projectNav" type="button"><span aria-hidden="true">≡</span> Progetto</button>
      </nav>
    <div class="workspace-toolbar" id="workspaceToolbar"><button type="button" id="previewButton" aria-expanded="false">Breakdown</button><label id="workspaceLayoutControl">Vista <select id="workspaceLayout"><option value="single">Vista singola</option><option value="board-breakdown">Stripboard + Breakdown</option><option value="calendar-breakdown">Calendar + Breakdown</option><option value="calendar-board">Calendar + Stripboard</option></select></label></div></header>
    <main class="main">
      <div class="page">
        <div id="status" class="status" hidden></div>
        <section class="controls" id="controls">
          <div class="control" id="boardControl"><label for="boardSelect">PIANO DI LAVORAZIONE</label><div class="board-choice"><select id="boardSelect"></select></div></div>
          <div class="control" id="calendarControl"><label for="calendarSelect">CALENDARIO DEL PIANO</label><select id="calendarSelect"></select></div>
        </section>
        <section class="stats" id="stats" aria-label="Riepilogo del piano"></section>
        <section class="content-panel">
          <div class="panel-header"><div class="panel-heading"><div class="section-kicker" id="sectionKicker">PIANO DI LAVORAZIONE</div><h2 id="viewTitle">Stripboard</h2><p id="viewSubtitle"></p></div><div class="panel-tools" id="panelTools"><label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Cerca nelle strip o nel report" placeholder="Cerca scena, set, testo…"></label><div class="subboard-picker"><button id="toggleUnscheduled" class="subtle-button" type="button" aria-expanded="false" aria-controls="subboardMenu">Sub-board ▾</button><div id="subboardMenu" class="subboard-menu" role="group" aria-label="Sub-board da mostrare" hidden></div></div></div><button id="displaySettingsButton" class="subtle-button" type="button">Visualizzazione…</button><button id="stripColorsButton" class="subtle-button" type="button">Colori strip…</button><div id="boardEditingControls" class="view-editing-controls" hidden></div></div>

          <div id="workspaceViews" class="workspace-views">
          <div id="boardView" class="view"></div>
          <div id="doodView" class="view" hidden></div>
          <div id="reportView" class="view" hidden></div>
          <div id="calendarView" class="view" hidden></div>
          <div id="redFlagView" class="view" hidden></div>
          <div id="dataView" class="view" hidden></div>
          <div id="projectView" class="view" hidden><div class="inline-category-tools"><button id="reportNav" type="button">Report <em id="reportCount">—</em></button></div><div id="productionInfo"></div></div>
          <div id="workspaceSplitter" class="workspace-splitter" role="separator" aria-label="Ridimensiona pannelli" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="55" tabindex="0" hidden></div>
          <aside id="breakdownPreview" class="view breakdown-preview" aria-label="Anteprima Breakdown" hidden></aside>
          </div>
        </section>
        <footer>Stripboard Studio v1.20 <span>·</span> <a href="https://github.com/nebelwerfer41" target="_blank" rel="noopener noreferrer">nebelwerfer41</a><span class="footer-local">File elaborati in locale</span></footer>
      </div>
    </main>
  </div>
  <div id="displayOptions" hidden><div class="options-row">
          <div class="control" id="layoutControl"><label for="layoutSelect" id="layoutLabel">LAYOUT STRIPBOARD</label><select id="layoutSelect"></select></div>
          <section class="report-options" id="reportOptions" aria-label="Parametri generali del report" hidden>
            <label title="Separate records with a line"><input id="reportSeparateRecords" type="checkbox"> Separa record con una linea</label>
          </section>
          <section class="visibility-options" id="visibilityOptions" aria-label="Visibilità delle righe">
            <label><input id="hideBanners" type="checkbox"> Nascondi banner</label>
            <label><input id="hideDayBreaks" type="checkbox"> Nascondi fine giornata</label>
          </section>
          <div id="boardFieldPicker" hidden></div>
        </div></div>
  <dialog class="studio-overlay" id="moveDialog" aria-labelledby="moveTitle"><form method="dialog" id="moveForm"><h2 id="moveTitle">Sposta strip</h2><p id="moveSource"></p><label for="moveGroup">Destinazione</label><select id="moveGroup"></select><label for="movePosition">Posizione</label><select id="movePosition"></select><div class="dialog-actions"><button value="cancel" type="submit">Annulla</button><button value="move" type="submit">Sposta</button></div></form></dialog>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
